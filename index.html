<style>

  --top:#f3b8b2; --mid:#e9cde0; --bot:#b9bbe0;
  --radius:22px;
}
body[data-time="day"]{ --top:#f6d7cf; --mid:#e9d8ec; --bot:#c9d3ef; }
body[data-time="evening"]{ --top:#8fa4d8; --mid:#b4aad3; --bot:#f0c3cd; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{

}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.moon{position:absolute;top:34px;left:50%;width:74px;height:74px;margin-left:-37px;border-radius:50%;
  box-shadow:0 0 40px 10px rgba(255,255,255,.55);background:transparent}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset -22px 6px 0 0 #fff;filter:drop-shadow(0 0 10px #fff)}
body:not([data-time="evening"]) .moon{width:64px;height:64px;margin-left:-32px;box-shadow:0 0 50px 16px rgba(255,255,255,.65);background:rgba(255,255,255,.55)}
body:not([data-time="evening"]) .moon::before{display:none}
.cloud{position:absolute;background:rgba(255,255,255,.55);border-radius:60px;filter:blur(.5px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.c1{width:220px;height:56px;left:-40px;top:120px}
.cloud.c1::before{width:90px;height:90px;left:30px;top:-40px}.cloud.c1::after{width:70px;height:70px;left:110px;top:-28px}
.cloud.c2{width:260px;height:64px;right:-60px;top:190px;opacity:.8}
.cloud.c2::before{width:100px;height:100px;left:40px;top:-46px}.cloud.c2::after{width:80px;height:80px;left:140px;top:-30px}
.cloud.c3{width:340px;height:90px;left:-80px;bottom:60px;opacity:.85}
.cloud.c3::before{width:140px;height:140px;left:60px;top:-64px}.cloud.c3::after{width:110px;height:110px;left:200px;top:-44px}
.cloud.c4{width:300px;height:80px;right:-70px;bottom:20px;opacity:.9}
.cloud.c4::before{width:120px;height:120px;left:50px;top:-56px}.cloud.c4::after{width:100px;height:100px;left:170px;top:-40px}

.dayno{text-align:center;margin:22px 0 6px}

.dayno span{display:block;font-size:12px;text-transform:none;color:var(--ink-soft);margin-top:8px}

.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 12px;

.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(90,80,120,.35);background:rgba(255,255,255,.5);flex:0 0 26px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:transparent;font-size:15px;transition:.2s}
.check.on{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff;box-shadow:0 0 16px rgba(255,255,255,.9)}

textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,138,214,.2)}
button{font:inherit;font-weight:400;color:var(--ink);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:9px 16px;font-size:14px}

.node{position:absolute;left:-32px;top:18px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px rgba(255,255,255,.9)}

.ticks span::before{content:"";display:block;width:1px;height:8px;background:rgba(90,80,120,.35);margin:0 auto 2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;justify-items:center}
.cal .wd{font-size:11px;color:var(--ink-soft);}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wpill{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 0;text-align:center;cursor:pointer}
.wpill small{display:block;font-size:11px;color:var(--ink-soft)}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{scroll-snap-align:start;background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:150px}

function load(){
  try{ var raw=localStorage.getItem(LS); if(raw){ var s=JSON.parse(raw); return Object.assign(defaults(),s); } }catch(e){}
  return defaults();
}
var cloudTimer=null, cloudBusy=false, syncMsg='';
function setSync(t){ syncMsg=t; var el=document.getElementById('sync'); if(el) el.textContent=t; }
function save(local){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(!local) scheduleCloud();
}
function scheduleCloud(){
  setSync('сохраняю…');
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(pushCloud,1200);
}
function hasCloud(){ return CLOUD.api && CLOUD.api.indexOf('__')!==0 && CLOUD.token && CLOUD.token.indexOf('__')!==0 && typeof fetch==='function'; }
function pushCloud(){
  if(!hasCloud()){ setSync(''); return; }
  cloudBusy=true;
  fetch(CLOUD.api+'/kv/'+encodeURIComponent(CLOUD.key),{method:'PUT',headers:{'X-Potok-Token':CLOUD.token},body:JSON.stringify(state)})
   .then(function(r){ return r.json(); }).then(function(){ cloudBusy=false; setSync('сохранено ✓'); setTimeout(function(){ if(syncMsg==='сохранено ✓') setSync(''); },2000); })
   .catch(function(){ cloudBusy=false; setSync('нет связи, сохранено на устройстве'); });
}
function pullCloud(first){
  if(!hasCloud()) return Promise.resolve();
  return fetch(CLOUD.api+'/kv/'+encodeURIComponent(CLOUD.key),{headers:{'X-Potok-Token':CLOUD.token}})
   .then(function(r){ if(r.status===404) return null; return r.json(); })
   .then(function(d){
     var remote=null; if(d && d.value){ try{ remote=JSON.parse(d.value); }catch(e){} }
     if(remote && (remote.updatedAt||0)>(state.updatedAt||0)){
       var ui=state.ui; state=Object.assign(defaults(),remote); state.ui=ui||state.ui; migrateAll(); save(true); if(!modalOpen()) render();
     }else if(!remote || (state.updatedAt||0)>(remote.updatedAt||0)){ if(!cloudBusy && (state.updatedAt||0)>0) pushCloud(); }
   }).catch(function(){ if(first) setSync('нет связи, работаю с устройства'); });
}

/* ---------- расчёты ---------- */
function earned(){ return state.payments.reduce(function(s,p){ return s+(+p.amount||0); },0); }
function migrateDay(x){
  if(!x.tasks){ x.tasks=[]; if(x.top){ x.top.forEach(function(it,i){ if(it&&it.title) x.tasks.push({id:uid(),title:it.title,done:!!it.done,star:i===0}); }); } }
  return x;
}
function day(d){ if(!state.days[d]) state.days[d]={tasks:[],pick:[],counters:{wrote:0,reply:0,talk:0,offer:0},win:'',fear:''}; return migrateDay(state.days[d]); }
function dayRead(d){ return state.days[d]?migrateDay(state.days[d]):{tasks:[],pick:[],counters:{wrote:0,reply:0,talk:0,offer:0},win:'',fear:''}; }
function mainDone(d){ var x=state.days[d]; if(!x) return false; migrateDay(x); return x.tasks.some(function(q){ return q.star && q.done; }); }
function logHas(v){ return Array.isArray(v)?v.length>0:!!v; }
function habitDone(id,from,to){
  var n=0; for(var d in state.log){ if(d>=from && d<=to && logHas(state.log[d][id])) n++; } return n;
}
function variantCount(id,v,from,to){
  var n=0; for(var d in state.log){ if(d>=from && d<=to){ var x=state.log[d][id]; if(Array.isArray(x)?x.indexOf(v)>=0:x===v) n++; } } return n;
}
function habitItems(){
  var arr=[]; state.habits.forEach(function(h){
    if(h.variants&&h.variants.length) h.variants.forEach(function(v){ arr.push({key:h.id+'|'+v,hid:h.id,v:v,name:v,group:h.name}); });
    else arr.push({key:h.id,hid:h.id,v:null,name:h.name,group:null});
  }); return arr;
}
function itemByKey(k){ return habitItems().filter(function(i){ return i.key===k; })[0]; }
function itemDone(t,it){ var lg=state.log[t]||{}, v=lg[it.hid]; if(!it.v) return logHas(v); return Array.isArray(v)?v.indexOf(it.v)>=0:v===it.v; }
function toggleItem(t,it){
  var lg=state.log[t]||(state.log[t]={});
  if(!it.v){ if(logHas(lg[it.hid])) delete lg[it.hid]; else lg[it.hid]=true; return; }
  var arr=Array.isArray(lg[it.hid])?lg[it.hid].slice():(typeof lg[it.hid]==='string'?[lg[it.hid]]:[]);
  var i=arr.indexOf(it.v); if(i>=0) arr.splice(i,1); else arr.push(it.v);
  if(arr.length) lg[it.hid]=arr; else delete lg[it.hid];
}
function overallPct(getDone,getTarget){
  var sd=0, st=0; state.habits.forEach(function(h){ var tg=getTarget(h); sd+=Math.min(getDone(h),tg); st+=tg; }); return st?Math.round(sd/st*100):0;
}
function weekTarget(h){ return Math.max(1,Math.round(h.target*7/31)); }
function habitOf(id){ return state.habits.filter(function(h){ return h.id===id; })[0]; }
function migrateAll(){
  // лог: строка варианта -> массив
  for(var d in state.log){ for(var k in state.log[d]){ if(typeof state.log[d][k]==='string') state.log[d][k]=[state.log[d][k]]; } }
  // старые названия вариантов
  var ren={'щётка':'массаж щёткой','световая':'световая практика'};
  state.habits.forEach(function(h){
    if(h.variants) h.variants=h.variants.map(function(v){ return ren[v]||v; });
    if(h.id==='h_mass' && (!h.variants||!h.variants.length)) h.variants=['массаж щёткой','дарсонваль','массаж лица'];
  });
  for(var d2 in state.log){ var arr=state.log[d2]['h_mass']; if(Array.isArray(arr)) state.log[d2]['h_mass']=arr.map(function(v){ return ren[v]||v; }); var a2=state.log[d2]['h_prac']; if(Array.isArray(a2)) state.log[d2]['h_prac']=a2.map(function(v){ return ren[v]||v; }); }
  state.people.forEach(function(p){ if(p.amount==null) p.amount=0; });
  state.tasks.forEach(function(x){
    if(x.target==null){
      if(/50 знаком/.test(x.title)) x.target=50; else if(/25 разговор/.test(x.title)) x.target=25; else if(/^собрать 3 демо/.test(x.title)) x.target=3;
      if(x.target!=null) x.count=x.done?x.target:0;
    }
  });
}
function daysLeft(){ var t=todayStr(); if(t>MONTH_END) return 0; var from=t<MONTH_START?MONTH_START:t; return diffDays(MONTH_END,from)+1; }
function timeOfDay(){ var h=new Date().getHours(); return h>=5&&h<12?'morning':(h>=12&&h<18?'day':'evening'); }
function greeting(){ var h=new Date().getHours(); return h<5?'доброй ночи':h<12?'доброе утро':h<18?'добрый день':'добрый вечер'; }

  var q=x.target>0, done=q?(x.count>=x.target):x.done;

function habitRow(hb,t){

    if(!list.length) h+='<div class="empty">пусто</div>';
    list.forEach(function(p){
      var late=p.nextDate?diffDays(t,p.nextDate):-1, cls=(p.stage!=='paid'&&p.nextDate)?(late>0?' late':(late===0?' today':'')):'';
      h+='<div class="person'+cls+'"><b>'+esc(p.name)+'</b>'+(p.note?'<div class="small">'+esc(p.note)+'</div>':'')+(p.next?'<div class="small" style="margin-top:4px">дальше: '+esc(p.next)+(p.nextDate?' · '+esc(p.nextDate.split('-').reverse().slice(0,2).join('.')):'')+'</div>':'')+(p.amount?'<div class="small">сумма '+money(p.amount)+'</div>':'');
      h+='<div class="acts">'+(si>0?'<button class="btn ghost" data-a="mv" data-id="'+p.id+'" data-d="-1" aria-label="назад">←</button>':'')+(si<STAGES.length-1?'<button class="btn ghost" data-a="mv" data-id="'+p.id+'" data-d="1" aria-label="дальше">→</button>':'')+'<button class="btn ghost" data-a="editPerson" data-id="'+p.id+'">правка</button><button class="x" data-a="delPerson" data-id="'+p.id+'" aria-label="удалить">×</button></div></div>';
    });
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

/* ---------- модалка ---------- */
function modalOpen(){ return !!document.getElementById('modal'); }
function closeModal(){ var m=document.getElementById('modal'); if(m) m.parentNode.removeChild(m); }
function openModal(html,onSubmit){
  closeModal();
  var bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal';
  bg.innerHTML='<form class="modal">'+html+'</form>';
  document.body.appendChild(bg);
  bg.addEventListener('click',function(e){ if(e.target===bg) closeModal(); });
  var f=bg.querySelector('form');
  f.addEventListener('submit',function(e){ e.preventDefault(); var fd={}; Array.prototype.forEach.call(f.elements,function(el){ if(el.name) fd[el.name]=el.value; }); onSubmit(fd); });
  var first=f.querySelector('input,textarea'); if(first&&first.focus) first.focus();
}
function payModal(personName){
  openModal('<h3>оплата</h3><input type="number" name="amount" inputmode="decimal" placeholder="сумма, ₽" required><input type="text" name="note" placeholder="за что или от кого" value="'+esc(personName||'')+'"><div class="two"><button type="button" class="btn ghost" id="mc">отмена</button><button class="btn primary">сохранить</button></div>',
   function(fd){ var a=parseFloat(fd.amount); if(!a||a<=0) return; state.payments.push({id:uid(),date:todayStr(),amount:a,note:fd.note||''}); save(); closeModal(); render(); });
  document.getElementById('mc').addEventListener('click',closeModal);
}
function taskModal(x,onDelete){
  var withTarget=!onDelete;
  openModal('<h3>задача</h3><textarea name="title" required>'+esc(x.title)+'</textarea>'+(withTarget?'<input type="number" name="target" inputmode="numeric" placeholder="сколько раз (если количественная)" value="'+(x.target>0?esc(x.target):'')+'">':'')+'<div class="two"><button type="button" class="btn ghost" id="md">удалить</button><button class="btn primary">сохранить</button></div><button type="button" class="btn ghost" id="mc">отмена</button>',
   function(fd){ var v=(fd.title||'').trim(); if(!v) return; x.title=v; if(withTarget){ var tg=parseInt(fd.target,10); if(tg>0){ x.target=tg; x.count=Math.min(x.count||0,tg); x.done=x.count>=tg; } else { delete x.target; delete x.count; } } save(); closeModal(); render(); });
  document.getElementById('mc').addEventListener('click',closeModal);
  document.getElementById('md').addEventListener('click',function(){ if(onDelete) onDelete(); else state.tasks=state.tasks.filter(function(q){ return q!==x; }); save(); closeModal(); render(); });
}
function habitModal(hb){
  openModal('<h3>привычка</h3><input type="text" name="name" value="'+esc(hb.name)+'" required><input type="number" name="target" inputmode="numeric" placeholder="цель на месяц, раз" value="'+esc(hb.target)+'" required><input type="text" name="variants" placeholder="варианты через запятую (необязательно)" value="'+esc((hb.variants||[]).join(', '))+'"><div class="two"><button type="button" class="btn ghost" id="md">удалить</button><button class="btn primary">сохранить</button></div><button type="button" class="btn ghost" id="mc">отмена</button>',
   function(fd){ var n=(fd.name||'').trim(), tg=parseInt(fd.target,10); if(!n||!tg||tg<1) return; hb.name=n; hb.target=tg; var vs=(fd.variants||'').split(',').map(function(v){ return v.trim(); }).filter(Boolean); if(vs.length) hb.variants=vs; else delete hb.variants; save(); closeModal(); render(); });
  document.getElementById('mc').addEventListener('click',closeModal);
  document.getElementById('md').addEventListener('click',function(){ state.habits=state.habits.filter(function(q){ return q!==hb; }); for(var d in state.log){ delete state.log[d][hb.id]; } save(); closeModal(); render(); });
}
function personModal(p){
  openModal('<h3>человек</h3><input type="text" name="name" placeholder="имя" value="'+esc(p.name)+'" required><input type="text" name="note" placeholder="чем занимается, что нужно" value="'+esc(p.note)+'"><input type="text" name="next" placeholder="следующий шаг" value="'+esc(p.next)+'"><input type="date" name="nextDate" value="'+esc(p.nextDate||'')+'"><input type="number" name="amount" inputmode="decimal" placeholder="сумма проекта, ₽" value="'+(p.amount?esc(p.amount):'')+'"><div class="two"><button type="button" class="btn ghost" id="mc">отмена</button><button class="btn primary">сохранить</button></div>',
   function(fd){ p.name=fd.name; p.note=fd.note; p.next=fd.next; p.nextDate=fd.nextDate||''; p.amount=parseFloat(fd.amount)||0; save(); closeModal(); render(); });
  document.getElementById('mc').addEventListener('click',closeModal);
}
function pickModal(t){
  var d=day(t), items=habitItems(), sel=(d.pick||[]).slice();
  var rows=items.map(function(it){ var hb=habitOf(it.hid); return '<label><input type="checkbox" name="k" value="'+esc(it.key)+'"'+(sel.indexOf(it.key)>=0?' checked':'')+'><span>'+esc(it.name)+(it.group?' <span class="small">· '+esc(it.group)+'</span>':'')+' <span class="small">· '+habitDone(it.hid,COUNT_FROM,MONTH_END)+' / '+hb.target+'</span></span></label>'; }).join('');
  openModal('<h3>что делаю сегодня</h3><div class="small">выбери до трёх</div><div class="pick-list" style="max-height:46vh;overflow:auto">'+rows+'</div><div class="two"><button type="button" class="btn ghost" id="mc">отмена</button><button class="btn primary">сохранить</button></div>',
   function(){ var picked=Array.prototype.map.call(document.querySelectorAll('#modal input[name=k]:checked'),function(i){ return i.value; }).slice(0,3); d.pick=picked; save(); closeModal(); render(); });
  document.getElementById('mc').addEventListener('click',closeModal);
  var boxes=document.querySelectorAll('#modal input[name=k]');
  Array.prototype.forEach.call(boxes,function(bx){ bx.addEventListener('change',function(){ if(document.querySelectorAll('#modal input[name=k]:checked').length>3){ bx.checked=false; } }); });
}

/* ---------- отрисовка ---------- */
function render(){
  document.body.setAttribute('data-time',timeOfDay());
  var pg=state.ui.page||'today', app=document.getElementById('app');
  app.className=pg==='people'?'wide':'';
  app.innerHTML=pg==='month'?pageMonth():pg==='week'?pageWeek():pg==='people'?pagePeople():pageToday();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){ b.classList.toggle('on',b.getAttribute('data-p')===pg); });
  var y=window.__keepY; if(typeof y==='number'){ window.scrollTo(0,y); window.__keepY=null; }
}
function rerender(){ window.__keepY=window.pageYOffset; render(); }

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null; if(!el) return;
  var a=el.getAttribute('data-a'), id=el.getAttribute('data-id'), t=todayStr();
  function task(){ return state.tasks.filter(function(x){ return x.id===id; })[0]; }
  if(a==='nav'){ state.ui.page=el.getAttribute('data-p'); state.ui.pick=null; save(true); window.scrollTo(0,0); render(); return; }
  function dtask(){ return day(t).tasks.filter(function(q){ return q.id===id; })[0]; }
  if(a==='toggleDay'){ var q1=dtask(); if(q1){ q1.done=!q1.done; save(); rerender(); } return; }
  if(a==='starDay'){ var q2=dtask(); if(q2){ if(!q2.star && day(t).tasks.filter(function(z){ return z.star; }).length>=3){ setSync('ключевых уже три, сними звёздочку с другой'); setTimeout(function(){ setSync(''); },2500); return; } q2.star=!q2.star; save(); rerender(); } return; }
  if(a==='editDay'){ var q3=dtask(); if(q3) taskModal(q3,function(){ day(t).tasks=day(t).tasks.filter(function(z){ return z!==q3; }); }); return; }
  if(a==='delDay'){ day(t).tasks=day(t).tasks.filter(function(z){ return z.id!==id; }); save(); rerender(); return; }
  if(a==='addDayTask'){ var ni=document.getElementById('newDayTask'); var nv2=ni&&ni.value.trim(); if(nv2){ day(t).tasks.push({id:uid(),title:nv2,done:false,star:false}); save(); rerender(); } return; }
  if(a==='addPay'){ payModal(''); return; }
  if(a==='undoPay'){ state.payments.pop(); save(); rerender(); return; }
  if(a==='delPay'){ state.payments=state.payments.filter(function(p){ return p.id!==id; }); save(); rerender(); return; }
  if(a==='habit'){
    var hb=habitOf(id); if(!hb) return;
    if(hb.variants&&hb.variants.length){ state.ui.pick=(state.ui.pick===id?null:id); rerender(); return; }
    toggleItem(t,{hid:id,v:null}); save(); rerender(); return;
  }
  if(a==='toggleItem'){ var it=itemByKey(el.getAttribute('data-key')); if(it){ toggleItem(t,it); save(); rerender(); } return; }
  if(a==='openPick'){ pickModal(t); return; }
  if(a==='unpick'){ var dk=day(t); dk.pick=(dk.pick||[]).filter(function(k){ return k!==el.getAttribute('data-key'); }); save(); rerender(); return; }
  if(a==='doneStep'){ var ps=state.people.filter(function(q){ return q.id===id; })[0]; if(ps){ ps.next=''; ps.nextDate=''; save(); rerender(); personModal(ps); } return; }
  if(a==='toggleTask'){ var x=task(); if(x){ if(x.target>0){ x.count=(x.count>=x.target)?0:x.target; x.done=x.count>=x.target; } else x.done=!x.done; save(); rerender(); } return; }
  if(a==='taskInc'){ var xi=task(); if(xi&&xi.target>0){ xi.count=Math.max(0,Math.min(xi.target,(xi.count||0)+(+el.getAttribute('data-d')))); xi.done=xi.count>=xi.target; save(); rerender(); } return; }
  if(a==='taskWeek'){ var x2=task(); if(x2){ var wk=state.ui.weekMon||mondayOf(t); x2.week=(x2.week===wk?null:wk); save(); rerender(); } return; }
  if(a==='unweek'){ var x3=task(); if(x3){ x3.week=null; x3.day=null; save(); rerender(); } return; }
  if(a==='taskToday'){ var x4=task(); if(x4){ x4.day=(x4.day===t?null:t); if(x4.day&&!x4.week) x4.week=mondayOf(t); save(); rerender(); } return; }
  if(a==='delTask'){ state.tasks=state.tasks.filter(function(x){ return x.id!==id; }); save(); rerender(); return; }
  if(a==='addTask'){ var inp2=document.getElementById('newTask'); var v=inp2&&inp2.value.trim(); var tg2=parseInt((document.getElementById('newTaskTarget')||{}).value,10); if(v){ var nt={id:uid(),title:v,done:false,scope:'month',week:null,day:null}; if(tg2>0){ nt.target=tg2; nt.count=0; } state.tasks.push(nt); save(); rerender(); } return; }
  if(a==='addWeekTask'){ var inp3=document.getElementById('newWeekTask'); var v3=inp3&&inp3.value.trim(); var tg3=parseInt((document.getElementById('newWeekTarget')||{}).value,10); if(v3){ var wt2={id:uid(),title:v3,done:false,scope:'week',week:state.ui.weekMon||mondayOf(t),day:null}; if(tg3>0){ wt2.target=tg3; wt2.count=0; } state.tasks.push(wt2); save(); rerender(); } return; }
  if(a==='editTask'){ var x5=task(); if(x5) taskModal(x5); return; }
  if(a==='editHabit'){ var h5=state.habits.filter(function(q){ return q.id===id; })[0]; if(h5) habitModal(h5); return; }
  if(a==='addHabit'){ var hn=document.getElementById('newHabit'), ht=document.getElementById('newHabitTarget'); var nm=hn&&hn.value.trim(), tg=ht&&parseInt(ht.value,10); if(nm&&tg>0){ state.habits.push({id:'h_'+uid(),name:nm,target:tg}); save(); rerender(); } return; }
  if(a==='wk'){ var dv=+el.getAttribute('data-d'); state.ui.weekMon=dv===0?null:addDays(state.ui.weekMon||mondayOf(t),dv); save(true); render(); return; }
  if(a==='addPerson'){ var n=document.getElementById('pName'), no=document.getElementById('pNote'); var nv=n&&n.value.trim(); if(nv){ state.people.push({id:uid(),name:nv,note:no?no.value.trim():'',stage:'wrote',next:'',nextDate:'',amount:0}); save(); rerender(); } return; }
  if(a==='mv'){ var p=state.people.filter(function(q){ return q.id===id; })[0]; if(!p) return; var idx=STAGES.map(function(s){return s[0];}).indexOf(p.stage)+(+el.getAttribute('data-d')); if(idx<0||idx>=STAGES.length) return; p.stage=STAGES[idx][0]; save(); rerender(); if(p.stage==='paid') payModal(p.name); return; }
  if(a==='editPerson'){ var pe=state.people.filter(function(q){ return q.id===id; })[0]; if(pe) personModal(pe); return; }
  if(a==='delPerson'){ state.people=state.people.filter(function(q){ return q.id!==id; }); save(); rerender(); return; }
});
document.addEventListener('change',function(e){
  var el=e.target; var f=el.getAttribute&&el.getAttribute('data-f'); if(!f) return; var t=todayStr();
  if(f==='win'||f==='fear'){ day(t)[f]=el.value; save(); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&(e.target.id==='newTask'||e.target.id==='newTaskTarget')){ e.preventDefault(); var b=document.querySelector('[data-a="addTask"]'); if(b) b.click(); }
  if(e.key==='Enter'&&e.target&&e.target.id==='newDayTask'){ e.preventDefault(); var b5=document.querySelector('[data-a="addDayTask"]'); if(b5) b5.click(); }
  if(e.key==='Enter'&&e.target&&e.target.id==='newWeekTask'){ e.preventDefault(); var b3=document.querySelector('[data-a="addWeekTask"]'); if(b3) b3.click(); }
  if(e.key==='Enter'&&e.target&&(e.target.id==='newHabit'||e.target.id==='newHabitTarget')){ e.preventDefault(); var b4=document.querySelector('[data-a="addHabit"]'); if(b4) b4.click(); }
  if(e.key==='Enter'&&e.target&&(e.target.id==='pName'||e.target.id==='pNote')){ e.preventDefault(); var b2=document.querySelector('[data-a="addPerson"]'); if(b2) b2.click(); }
  if(e.key==='Escape') closeModal();
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ pullCloud(false); render(); } });
setInterval(function(){ if(!document.hidden && !modalOpen()) pullCloud(false); },60000);

state=load();
migrateAll();
render();
if(hasCloud()){ setSync('синхронизирую…'); pullCloud(true).then(function(){ if(syncMsg==='синхронизирую…') setSync(''); }); }
})();
</script>
